buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}


apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
}

android {
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'org.xapek.andiodine'
        namespace 'org.xapek.andiodine'
        versionCode 7
        versionName "1.7"
        compileSdk 35
        minSdkVersion 26
        ndk.abiFilters 'armeabi-v7a','arm64-v8a','x86','x86_64'
    }
}