name: Android build and tests
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      device_tests:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            android/.deps/arm64-v8a
            android/.deps/armeabi-v7a
            android/.deps/x86
            android/.deps/x86_64
            android/.deps/openssl/*.tar.gz
          key: openssl-android-${{ runner.os }}-ndk29-${{ hashFiles('android/scripts/build-openssl.sh') }}
      - name: Build all ABIs, unit tests and lint
        run: ./tools/ci-android.sh '${{ inputs.release }}'
      - name: Android 15 profile and security device tests
        if: inputs.device_tests
        run: ./tools/ci-android-device.sh
      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release && 'android-release-unsigned' || 'android-debug' }}
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            android/build/reports
            android/build/outputs/androidTest-results
            ${{ runner.temp }}/android-emulator.log
          retention-days: 14
