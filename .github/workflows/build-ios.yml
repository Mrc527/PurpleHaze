name: iOS build and profile checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: openssl
        with:
          path: |
            ios/build-ios/deps/iphoneos
            ios/build-ios/openssl
          key: openssl-ios-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('ios/build-openssl.sh') }}
      - name: Profile regression checks and unsigned device build
        run: ./tools/ci-ios.sh
      - name: Upload unsigned iOS app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-app
          path: artifacts/ios/PurpleHaze-iOS-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14
