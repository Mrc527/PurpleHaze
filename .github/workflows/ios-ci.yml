name: IOS CI
on:
  push:
    branches: [main]
    paths: ['ios/**', 'vendor/**', 'scripts/**', 'tools/**', '.github/workflows/**']
  pull_request:
    paths: ['ios/**', 'vendor/**', 'scripts/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/build-ios.yml
