name: Unsigned release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.9.0'
        required: true
        type: string
      draft:
        description: 'Create a draft release for review'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Resolve an existing version tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const tag = process.env.RELEASE_TAG;
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?$/.test(tag)) throw Error('Use an existing semantic version tag');
          const sha = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], {encoding:'utf8'}).trim();
          if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid tag commit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nsha=${sha}\n`);
          JS
  android:
    needs: version
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      release: true
      device_tests: true
  ios:
    needs: version
    uses: ./.github/workflows/build-ios.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
  publish:
    needs: [version, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-unsigned
          path: artifacts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-unsigned-app
          path: artifacts/release
      - name: Publish only validated unsigned build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          node tools/ci_monitor.cjs --help
          node tools/release-publish.cjs
